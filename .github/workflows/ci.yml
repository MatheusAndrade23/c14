name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx poku --json > test-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./test-report.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  notify:
    runs-on: ubuntu-latest
    needs: [tests, build]
    steps:
      - name: Install mailutils
        run: sudo apt-get update && sudo apt-get install -y mailutils

      - name: Send mail
        run: |
          echo "Pipeline executado com sucesso." | mail -s "Pipeline executado!" ${{ secrets.GH_NOTIFY_EMAIL }}
